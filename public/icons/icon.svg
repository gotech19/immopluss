<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0A3D91" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A3D91" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="#0A3D91" />

  <!-- Outer Orbit Rings around pin base -->
  <ellipse cx="256" cy="400" rx="150" ry="42" fill="none" stroke="#38BDF8" stroke-width="14" opacity="0.8" />
  <ellipse cx="256" cy="400" rx="100" ry="26" fill="none" stroke="#FBBF24" stroke-width="10" />

  <!-- Glowing Yellow/Gold Location Pin -->
  <g filter="url(#shadow)">
    <path d="M 256 60 
             C 170 60, 100 130, 100 216 
             C 100 296, 210 395, 246 422 
             C 252 426, 260 426, 266 422 
             C 302 395, 412 296, 412 216 
             C 412 130, 342 60, 256 60 Z" 
          fill="url(#pinGrad)" />
  </g>

  <!-- Inner circle in pin -->
  <circle cx="256" cy="205" r="110" fill="#FFFFFF" />

  <!-- House silhouette in Deep Navy (#0A3D91) -->
  <!-- Chimney -->
  <rect x="296" y="148" width="18" height="34" rx="3" fill="#0A3D91" />
  <!-- Roof -->
  <path d="M 256 128 L 180 196 L 194 204 L 256 148 L 318 204 L 332 196 Z" fill="#0A3D91" />
  <!-- House Body -->
  <path d="M 200 194 L 312 194 L 312 270 C 312 274, 308 278, 304 278 L 208 278 C 204 278, 200 274, 200 270 Z" fill="#0A3D91" />

  <!-- 4-Pane Yellow Window inside House -->
  <rect x="238" y="216" width="16" height="16" rx="2" fill="#FBBF24" />
  <rect x="258" y="216" width="16" height="16" rx="2" fill="#FBBF24" />
  <rect x="238" y="236" width="16" height="16" rx="2" fill="#FBBF24" />
  <rect x="258" y="236" width="16" height="16" rx="2" fill="#FBBF24" />

  <!-- Plus symbol badge overlay at top right of house -->
  <circle cx="340" cy="136" r="28" fill="#F59E0B" stroke="#FFFFFF" stroke-width="4" />
  <rect x="336" y="120" width="8" height="32" rx="3" fill="#FFFFFF" />
  <rect x="324" y="132" width="32" height="8" rx="3" fill="#FFFFFF" />
</svg>
